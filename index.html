<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diva Makeup Cali - Catálogo</title>
    <script src="https://jsdelivr.net" defer></script>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-pink-50 text-gray-800 font-sans" x-data="catalogo()">

    <!-- Encabezado -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50 text-center">
        <h1 class="text-2xl font-bold text-pink-600 tracking-wide">DIVA MAKEUP CALI</h1>
        <p class="text-xs text-gray-500">Catálogo Virtual Interactivo</p>
        
        <!-- Buscador -->
        <div class="mt-3 max-w-md mx-auto">
            <input type="text" x-model="buscar" placeholder="Buscar producto (ej. labial, base)..." 
                   class="w-full px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:border-pink-500 text-sm shadow-inner">
        </div>
    </header>

    <!-- Contenedor Principal / Vitrina -->
    <main class="max-w-6xl mx-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-4">
        <template x-for="producto in productosFiltrados()" :key="producto.id">
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-pink-100 flex flex-col justify-between">
                <div>
                    <img :src="producto.imagen" :alt="producto.nombre" class="w-full h-40 object-cover">
                    <div class="p-3">
                        <h3 class="font-semibold text-sm text-gray-900 leading-tight" x-text="producto.nombre"></h3>
                        <p class="text-xs text-gray-500 mt-1 line-clamp-2" x-text="producto.descripcion"></p>
                    </div>
                </div>
                <div class="p-3 pt-0">
                    <div class="text-pink-600 font-bold text-base mb-2" x-text="'$' + producto.precio.toLocaleString('es-CO')"></div>
                    <button @click="agregarAlCarrito(producto)" 
                            class="w-full bg-pink-500 hover:bg-pink-600 text-white text-xs font-medium py-2 rounded-lg transition shadow-sm">
                        Añadir al carrito
                    </button>
                </div>
            </div>
        </template>
    </main>

    <!-- Barra del Carrito Flotante (Se activa si hay productos) -->
    <div x-show="carrito.length > 0" 
         class="fixed bottom-0 inset-x-0 bg-white border-t border-pink-100 p-4 shadow-xl z-50 flex justify-between items-center max-w-md mx-auto rounded-t-2xl">
        <div>
            <span class="text-sm font-bold text-gray-800" x-text="carrito.reduce((sum, item) => sum + item.cantidad, 0) + ' productos'"></span>
            <div class="text-pink-600 font-extrabold text-lg" x-text="'Total: $' + calcularTotal().toLocaleString('es-CO')"></div>
        </div>
        <button @click="enviarWhatsApp()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-xl text-sm flex items-center gap-2 shadow-md">
            Pedir por WhatsApp
        </button>
    </div>

    <script>
        function catalogo() {
            return {
                buscar: '',
                numeroWhatsApp: '573000000000', // <-- REEMPLAZAR CON TU NÚMERO (Con código de país, ej: 57 para Colombia)
                carrito: [],
                // Aquí añades o modificas los productos de tu inventario
                productos: [
                    { id: 1, nombre: "Labial Matte Larga Duración", precio: 15000, descripcion: "Tono rojo intenso, no transfiere e hidrata tus labios.", imagen: "https://unsplash.com" },
                    { id: 2, nombre: "Base de Maquillaje Alta Cobertura", precio: 32000, descripcion: "Efecto porcelana, control de brillo y acabado mate.", imagen: "https://unsplash.com" },
                    { id: 3, nombre: "Kit de Brochas Profesionales x12", precio: 45000, descripcion: "Pelo sintético ultra suave para difuminar perfectamente.", imagen: "https://unsplash.com" },
                    { id: 4, nombre: "Paleta de Sombras 'Neon Dreams'", precio: 28000, descripcion: "9 tonos ultra pigmentados entre mates y satinados.", imagen: "https://unsplash.com" }
                ],
                productosFiltrados() {
                    return classFiltrada = this.productos.filter(p => p.nombre.toLowerCase().includes(this.buscar.toLowerCase()));
                },
                agregarAlCarrito(producto) {
                    let encontrado = this.carrito.find(item => item.id === producto.id);
                    if (encontrado) { encontrado.cantidad++; } 
                    else { this.carrito.push({ ...producto, cantidad: 1 }); }
                },
                calcularTotal() {
                    return this.carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
                },
                enviarWhatsApp() {
                    let texto = "¡Hola Diva Makeup! 💄 Quiero hacer el siguiente pedido:\n\n";
                    this.carrito.forEach(item => {
                        texto += `• ${item.cantidad}x ${item.nombre} ($${(item.precio * item.cantidad).toLocaleString('es-CO')})\n`;
                    });
                    texto += `\n*Total a pagar: $${this.calcularTotal().toLocaleString('es-CO')}*`;
                    let url = `https://whatsapp.com{this.numeroWhatsApp}&text=${encodeURIComponent(texto)}`;
                    window.open(url, '_blank');
                }
            }
        }
    </script>
</body>
</html>
